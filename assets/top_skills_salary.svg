    <text x="883" y="130">$115,320</text><text x="877" y="168">$114,210</text>
    <text x="872" y="206">$113,193</text><text x="871" y="244">$112,948</text>
    <text x="862" y="282">$111,225</text><text x="854" y="320">$109,654</text>
    <text x="848" y="358">$108,317</text><text x="841" y="396">$106,906</text>
